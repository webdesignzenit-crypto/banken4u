        name: kicker
        widget: string
      - label: Überschrift
        name: titel
        widget: string
      - label: Text
        name: text
        widget: text
    - label: 'Google: Seitentitel'
      name: metaTitle
      widget: string
    - label: 'Google: Beschreibung'
      name: metaDescription
      widget: text
