- name: ratgeber
  label: Ratgeber-Artikel
  label_singular: Ratgeber-Artikel
  folder: content/ratgeber
  extension: json
  format: json
  create: true
  delete: true
  slug: '{{fields.slug}}'
  identifier_field: title
  summary: '{{title}}'
  sortable_fields:
  - order
  - title
  editor:
    preview: false
  fields:
  - label: Reihenfolge
    name: order
    widget: number
    value_type: int
    default: 10
    hint: Kleine Zahl = weiter vorn in der Übersicht
  - label: Adresse (z. B. kaufnebenkosten-sachsen)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Nur Kleinbuchstaben, Zahlen und Bindestriche, keine Umlaute
    hint: 'Wird Teil der Internetadresse: banken4u.de/ratgeber/…. Nach dem ersten Speichern nicht mehr ändern.'
  - label: Überschrift
    name: title
    widget: string
  - label: Einleitung
    name: lead
    widget: text
  - label: Lesezeit in Minuten
    name: readingMinutes
    widget: number
    value_type: int
    default: 5
  - label: Stand (z. B. November 2026)
    name: updated
    widget: string
  - label: Bild
    name: image
    widget: image
    required: false
    hint: Querformat, mindestens 2400 Pixel breit
  - label: Abschnitte
    name: sections
    widget: list
    summary: '{{fields.heading}}'
    fields:
    - label: Überschrift
