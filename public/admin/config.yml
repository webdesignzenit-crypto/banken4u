# Bearbeitungsbereich für banken4u.de (Decap CMS)
# Anmeldung: E-Mail und Passwort über Netlify Identity, Speichern über Git Gateway.
# Jede Veröffentlichung speichert die Datei im Repository; Netlify baut die Seite danach neu (ca. 1–2 Minuten).
# Diese Datei wird aus scripts/cms-config.src.yml erzeugt (python3 scripts/build-cms-config.py).

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Neu: {{collection}} „{{slug}}“'
    update: 'Geändert: {{collection}} „{{slug}}“'
    delete: 'Gelöscht: {{collection}} „{{slug}}“'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}}'
local_backend: true
locale: de
site_url: https://banken4u.de
display_url: https://banken4u.de
logo_url: /img/logo-192.webp
publish_mode: simple
show_preview_links: false
media_folder: public/img/uploads
public_folder: /img/uploads
collections:
- name: startseite
  label: Startseite
  editor:
    preview: false
  files:
  - name: startseite
    label: Startseite
    file: content/startseite.json
    fields:
    - label: Großes Titelbild oben
      name: hero
      widget: object
      fields:
      - label: Kleine Zeile über dem Slogan
        name: kicker
        widget: string
      - label: Slogan Zeile 1
        name: zeile1
        widget: string
      - label: Slogan Zeile 2
        name: zeile2
        widget: string
      - label: Slogan Zeile 2 (rot hervorgehoben)
        name: zeile2Betont
        widget: string
      - label: Text unter dem Slogan
        name: text
        widget: text
      - label: Knopf Rückruf
        name: buttonRueckruf
        widget: string
      - label: Knopf Angebot
        name: buttonAngebot
        widget: string
    - label: Vorstellung
      name: vorstellung
      widget: object
      fields:
      - label: Kleine Zeile
        name: kicker
        widget: string
      - label: Überschrift
        name: titel
        widget: string
      - label: Text
        name: text
        widget: text
      - label: Punkte
        name: punkte
        widget: list
        field:
          label: Punkt
          name: punkt
          widget: string
        label_singular: Punkt
      - label: Bildunterschrift
        name: bildunterschrift
        widget: string
      - label: Zusatz unter dem Namen
        name: unterschriftZusatz
        widget: string
    - label: Zahlen (Beschriftungen)
      name: zahlen
      widget: object
      hint: Die Zahlen selbst stehen unter „Allgemeine Angaben“.
      fields:
      - label: Banken
        name: banken
        widget: string
      - label: Versicherer
        name: versicherer
        widget: string
      - label: Jahre
        name: jahre
        widget: string
      - label: Bewertung
        name: bewertung
        widget: string
    - label: Leistungen
      name: leistungen
      widget: object
      fields:
      - label: Überschrift
        name: titel
        widget: string
      - label: Text
        name: text
        widget: text
      - label: Text im Baufinanzierungs-Kasten
        name: schwerpunktText
        widget: text
      - label: Hinweis im Baufinanzierungs-Kasten
        name: hinweis
        widget: text
      - label: Ratenkredit
        name: ratenkredit
        widget: text
      - label: Bausparen
        name: bausparen
        widget: text
      - label: Geldanlage
        name: geldanlage
        widget: text
      - label: Versicherungen
        name: versicherungen
        widget: text
    - label: Ablauf
      name: ablauf
      widget: object
      fields:
      - label: Überschrift
        name: titel
        widget: string
      - label: Text
        name: text
        widget: text
      - label: Text auf dem Bild
        name: bildtext
        widget: string
      - label: Schritte
        name: schritte
        widget: list
        summary: '{{fields.title}}'
        fields:
        - label: Titel
          name: title
          widget: string
        - label: Text
          name: text
          widget: text
        label_singular: Schritt
    - label: Bewertungen
      name: bewertungen
      widget: object
      fields:
      - label: Überschrift
        name: titel
        widget: string
      - label: Text
        name: text
        widget: text
      - label: Zeile unter den Sternen
        name: zusatz
        widget: string
    - label: Vergütung
      name: verguetung
      widget: object
      fields:
      - label: Kleine Zeile
        name: kicker
        widget: string
      - label: Überschrift
        name: titel
        widget: string
      - label: Überschrift (hervorgehoben)
        name: titelBetont
        widget: string
      - label: Text
        name: text
        widget: text
      - label: Punkte
        name: punkte
        widget: list
        summary: '{{fields.title}}'
        fields:
        - label: Titel
          name: title
          widget: string
        - label: Text
          name: text
          widget: text
        label_singular: Punkt
    - label: Rechner
      name: rechner
      widget: object
      fields:
      - label: Überschrift
        name: titel
        widget: string
      - label: Text
        name: text
        widget: text
    - label: Kontakt unten
